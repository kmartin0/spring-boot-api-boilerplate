# === Global environment properties ===
# TODO: Create the local database before starting the application. You can use resources/db/demo-db.sql.

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${DB_URI:jdbc:mysql://localhost:3306/db_spring_boot_boilerplate_api?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Authorization Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/.well-known/jwks.json
security.oauth2.authorization.jwt.key-store=${JWK_KEYSTORE_PATH:classpath:keystore/demo-dev-jwk.jks}
security.oauth2.authorization.jwt.key-store-password=${JWK_KEYSTORE_PASS:demo-pass}
security.oauth2.authorization.jwt.key-alias=${JWK_KEYSTORE_ALIAS:demo-alias}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:DUMMY_EMAIL@EMAIL.COM}
spring.mail.password=${EMAIL_PASSWORD:DUMMY_EMAIL_PASSWORD}

spring.mail.properties.mail.debug=false
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true

# Enable GlobalExceptionHandler to handle a 404 URI not found
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false